name: TypeScript CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        npm-version: [bundled, '12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Use npm 12
        if: matrix.npm-version == '12'
        run: npm install --global npm@12
      - run: npm --version
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:package
      - run: npm pack --dry-run --ignore-scripts
