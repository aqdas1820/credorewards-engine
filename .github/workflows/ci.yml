name: TypeScript CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: '24'
            npm-version: bundled
          - os: ubuntu-latest
            node-version: '24'
            npm-version: '12'
          - os: windows-latest
            node-version: '24'
            npm-version: bundled
          - os: windows-latest
            node-version: '24'
            npm-version: '12'
          - os: windows-latest
            node-version: '26'
            npm-version: '12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Use npm 12
        if: matrix.npm-version == '12'
        run: npm install --global npm@12
      - run: npm --version
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:package
      - run: npm run validate:catalog
      - name: Regression — inherited npm allow-scripts policy
        if: matrix.npm-version == '12'
        env:
          npm_config_allow_scripts: synthetic-ci-only-package
        run: npm run test:package
      - run: npm pack --dry-run --ignore-scripts
